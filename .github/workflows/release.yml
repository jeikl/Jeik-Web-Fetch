name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. 构建全平台通用 Wheel 与 Source 包
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheel
          path: dist/*

  # 2. 矩阵构建各系统单文件可执行文件 (含 ARM64)
  build-binaries:
    needs: [build-wheel]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            artifact_name: jeik-web-fetch-windows-x64.exe
            platform: windows
            arch: x64
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            artifact_name: jeik-web-fetch-darwin-arm64
            platform: macos
            arch: arm64
          # Linux x64 (直接使用主流 ubuntu-latest)
          - os: ubuntu-latest
            artifact_name: jeik-web-fetch-linux-x64
            platform: linux
            arch: x64
          # Linux ARM64 (GitHub 官方原生物理 ARM 机器，4核超高速秒出，完全不需要 QEMU 模拟！)
          - os: ubuntu-24.04-arm
            artifact_name: jeik-web-fetch-linux-arm64
            platform: linux
            arch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      # Linux 构建时使用包含极低 GLIBC 2.31 的 Debian 11 容器执行 PyInstaller 打包
      # 从而实现真正的全版本 Linux 兼容（兼容 CentOS 7/8/9, Debian 10/11/12, Ubuntu 18/20/22/24 等所有 Linux！）
      - name: Package with PyInstaller (Linux Compatibility Container)
        if: matrix.platform == 'linux'
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work python:3.11-bullseye /bin/bash -c "
            pip install --upgrade pip &&
            pip install -e . &&
            pip install pyinstaller &&
            pyinstaller --onefile --name jeik \
              --paths . \
              --collect-all jeik_web_fetch \
              --collect-all bs4 \
              --collect-all fastapi \
              --collect-all uvicorn \
              --collect-all httpx \
              --collect-all websockets \
              bin/jeik
          "

      - name: Package with PyInstaller (Native macOS / Windows)
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          pyinstaller --onefile \
            --name jeik \
            --paths . \
            --collect-all jeik_web_fetch \
            --collect-all bs4 \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all httpx \
            --collect-all websockets \
            bin/jeik

      - name: Rename Artifact
        shell: bash
        run: |
          mkdir -p release-bin
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp dist/jeik.exe release-bin/${{ matrix.artifact_name }}
          else
            cp dist/jeik release-bin/${{ matrix.artifact_name }}
            chmod +x release-bin/${{ matrix.artifact_name }}
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-bin/*

  # 3. 汇总所有平台的产物并自动发布到 GitHub Release
  release:
    needs: [build-wheel, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Display files to be released
        run: ls -la all-dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
